name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm ci is intentionally not used here: tsup's tinyglobby->fdir and ts-morph's
      # fast-glob->micromatch require conflicting picomatch semver ranges, and npm resolves/
      # writes that into the lockfile differently across npm versions. That makes `npm ci`
      # (which requires an exact lockfile match) fail non-deterministically across the Node
      # matrix even though the resulting install is fine. `npm install` resolves fresh instead.
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
